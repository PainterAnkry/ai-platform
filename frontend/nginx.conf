# nginx config for the AI Platform frontend.
# - SPA fallback to index.html so client-side routing works.
# - Proxies /api to the backend container so the browser only talks to one origin.
# - Aggressive cache for hashed assets, no cache for index.html.

server {
    listen 80;
    server_name _;

    # Sensible defaults.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    # Must stay >= the app's MAX_UPLOAD_SIZE_BYTES (25 MB), plus a little
    # headroom for the multipart envelope — otherwise nginx answers 413 before
    # FastAPI can report the real limit.
    client_max_body_size 26m;

    root /usr/share/nginx/html;
    index index.html;

    # ---- API reverse proxy ----
    # A static `upstream` block resolves `backend` ONCE at startup; when the
    # backend container is recreated it gets a new IP and every request 502s
    # until nginx restarts. Routing through a variable forces per-request DNS
    # resolution via Docker's embedded resolver (127.0.0.11, 10s TTL), so
    # backend restarts are transparent to the frontend.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- Hashed assets (long-lived) ----
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- Hashed JS/CSS emitted by Vite under /assets ----
    # (already covered above) — keep favicon & static files long-lived too.
    location = /favicon.svg {
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    # ---- SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}